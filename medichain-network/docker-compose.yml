version: '3.8'

networks:
  medichain:
    name: medichain-network

services:

  # ─── Certificate Authority ───────────────────────────────────────
  ca.org1.medichain.local:
    image: hyperledger/fabric-ca:1.5.7
    container_name: ca.org1.medichain.local
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=false
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    command: fabric-ca-server start -b admin:adminpw -d
    volumes:
      - ./crypto-config/peerOrganizations/org1.medichain.local/ca:/etc/hyperledger/fabric-ca-server-config
      - ca_org1_data:/etc/hyperledger/fabric-ca-server
    networks:
      - medichain
    restart: unless-stopped

  # ─── Orderer ─────────────────────────────────────────────────────
  orderer.medichain.local:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.medichain.local
    environment:
      - ORDERER_GENERAL_LOGLEVEL=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:8443
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:9444
    ports:
      - "7050:7050"
      - "9445:8443"
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./crypto-config/ordererOrganizations/medichain.local/orderers/orderer.medichain.local/msp:/var/hyperledger/orderer/msp
      - orderer_data:/var/hyperledger/production/orderer
    networks:
      - medichain
    restart: unless-stopped

  # ─── Peer0 Org1 ──────────────────────────────────────────────────
  peer0.org1.medichain.local:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.org1.medichain.local
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=medichain-network
      - CORE_LOGGING_LEVEL=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_ID=peer0.org1.medichain.local
      - CORE_PEER_ADDRESS=peer0.org1.medichain.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.medichain.local:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.medichain.local:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.medichain.local:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    ports:
      - "7051:7051"
      - "9444:9444"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/org1.medichain.local/peers/peer0.org1.medichain.local/msp:/etc/hyperledger/fabric/msp
      - peer0_org1_data:/var/hyperledger/production
    networks:
      - medichain
    depends_on:
      - orderer.medichain.local
      - couchdb0
    restart: unless-stopped

  # ─── CouchDB (rich queries for audit chaincode) ───────────────────
  couchdb0:
    image: couchdb:3.3
    container_name: couchdb0
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    volumes:
      - couchdb0_data:/opt/couchdb/data
    networks:
      - medichain
    restart: unless-stopped

volumes:
  ca_org1_data:
  orderer_data:
  peer0_org1_data:
  couchdb0_data:
